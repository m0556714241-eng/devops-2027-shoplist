# frontend-deployment.yml - your turn (step 9c)
# Skeleton copied from stats-deployment.yml: no env, no Secret, no readinessProbe
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend                  # name of this Deployment
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend              # the frontend label
  template:
    metadata:
      labels:
        app: frontend              # exactly the same label as above
    spec:
      containers:
        - name: frontend           # container name
          image: shoplist-frontend:local          # the frontend image we built, including the tag
          imagePullPolicy: Never
          ports:
            - containerPort: 80   # PORTS - stop here and ask

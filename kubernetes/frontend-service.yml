# frontend-service.yml - your turn (step 9d)
# Skeleton copied from stats-service.yml, plus type and nodePort
apiVersion: v1
kind: Service
metadata:
  name: frontend                   # name of this Service
  namespace: shoplist
spec:
  type: NodePort                   # the type that opens a door from your computer
  selector:
    app: frontend                  # must match the label in frontend-deployment.yml
  ports:                       # PORTS - stop here and ask
    - port: 80
      targetPort: 80
      nodePort: 30080
